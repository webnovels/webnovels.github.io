---
layout: default
---

<article class="novel-chapter">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<h3>{{ page.subtitle }}</h3>{% endif %}
  </header>

  <div class="chapter-content">
    {{ content }}
  </div>

  <div class="chapter-navigation" id="chapterNav">
    {% if page.previous_chapter %}
      <a href="{{ page.previous_chapter | relative_url }}" class="prev-link" id="prevLink">&laquo; Previous</a>
    {% else %}
      <a href="#" class="prev-link" id="prevLink" style="visibility:hidden;">&laquo; Previous</a>
    {% endif %}

    <a href="{{ page.novel_index | relative_url }}" class="index-link">Contents</a>

    {% if page.next_chapter %}
      <a href="{{ page.next_chapter | relative_url }}" class="next-link" id="nextLink">Next &raquo;</a>
    {% else %}
      <a href="#" class="next-link" id="nextLink" style="visibility:hidden;">Next &raquo;</a>
    {% endif %}
  </div>

  <div class="chapter-progress" id="chapterProgress"></div>

  <!-- 加入书架按钮 -->
  <div class="bookmark-bar">
    <button class="bookmark-btn" id="bookmarkBtn" data-novel-url="{{ page.novel_index | default: page.url }}">
      <i class="fa fa-bookmark"></i> <span class="bookmark-text">Add to Bookshelf</span>
    </button>
    <a href="{{ '/bookshelf/' | relative_url }}" class="view-bookshelf-link">
      <i class="fa fa-list"></i> View Bookshelf
    </a>
  </div>
</article>
<div class="sharethis-inline-share-buttons"></div>
<script async="async" data-cfasync="false" src="//pl26635144.profitableratecpm.com/b5f172e1b4dd73e35d84f383d130b32e/invoke.js"></script>
<div id="container-b5f172e1b4dd73e35d84f383d130b32e"></div>
<style>
  .novel-chapter {
    max-width: 800px;
    margin: 0 auto;
    padding: 0px;
    line-height: 1.8;
  }
  
  .chapter-content {
    margin: 0;
    font-size: 1.1em;
  }
  
  .chapter-navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    margin-bottom: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
  
  .chapter-navigation a {
    padding: 8px 16px;
    border: 1px solid #ddd;
    border-radius: 4px;
    text-decoration: none;
  }

  /* 书签栏样式 */
  .bookmark-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    margin-bottom: 30px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
  }
  .bookmark-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.3s, transform 0.2s;
  }
  .bookmark-btn:hover { background: #2980b9; }
  .bookmark-btn:active { transform: scale(0.97); }
  .bookmark-btn.active {
    background: #27ae60;
  }
  .bookmark-btn.active .bookmark-text::before { content: "✓ "; }
  .view-bookshelf-link {
    color: #7f8c8d;
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.3s;
  }
  .view-bookshelf-link:hover { color: #3498db; }
  .chapter-progress {
    text-align: center;
    font-size: 0.85rem;
    color: #95a5a6;
    margin-bottom: 25px;
    padding: 8px 12px;
    background: #f8f9fa;
    border-radius: 6px;
  }
</style>

<script>
// 书架功能 - 基于 localStorage，无需后端
document.addEventListener('DOMContentLoaded', function() {
  var bookmarkBtn = document.getElementById('bookmarkBtn');
  if (!bookmarkBtn) return;

  var novelUrl = bookmarkBtn.getAttribute('data-novel-url');
  var bookshelfKey = 'webnovels_bookshelf';
  var bookshelf = JSON.parse(localStorage.getItem(bookshelfKey) || '[]');

  // 初始化按钮状态
  if (bookshelf.indexOf(novelUrl) !== -1) {
    bookmarkBtn.classList.add('active');
    var textEl = bookmarkBtn.querySelector('.bookmark-text');
    if (textEl) textEl.textContent = 'In Your Bookshelf';
  }

  bookmarkBtn.addEventListener('click', function() {
    var shelf = JSON.parse(localStorage.getItem(bookshelfKey) || '[]');
    var idx = shelf.indexOf(novelUrl);
    var chapterTitle = '{{ page.title | escape }}';
    if (idx !== -1) {
      shelf.splice(idx, 1);
      bookmarkBtn.classList.remove('active');
      var textEl = bookmarkBtn.querySelector('.bookmark-text');
      if (textEl) textEl.textContent = 'Add to Bookshelf';
      if (window.trackEvent) trackEvent('bookmark_removed', { novel_url: novelUrl, source: 'chapter_page' });
    } else {
      shelf.push(novelUrl);
      bookmarkBtn.classList.add('active');
      var textEl2 = bookmarkBtn.querySelector('.bookmark-text');
      if (textEl2) textEl2.textContent = 'In Your Bookshelf';
      if (window.trackEvent) trackEvent('bookmark_added', { novel_url: novelUrl, source: 'chapter_page' });
    }
    localStorage.setItem(bookshelfKey, JSON.stringify(shelf));
  });

  // Track chapter navigation clicks
  document.querySelectorAll('.chapter-nav a, .prev-chapter, .next-chapter').forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.trackEvent) trackEvent('chapter_navigation', { target: this.getAttribute('href'), source: 'chapter_nav' });
    });
  });
});
</script>

<script src="/assets/js/supabase.js"></script>
<script>
// 动态章节导航 + 阅读进度（基于 Supabase）
// 正文内容仍为静态渲染（保证 SEO），仅导航链接和进度从数据库动态获取
(function () {
  var path = window.location.pathname;
  // URL 模式: /novels/<novelId>/<chapterNumber>/
  var m = path.match(/\/novels\/(\d+)\/(\d+)\/?/);
  if (!m) return;

  var novelId = parseInt(m[1], 10);
  var chapterNumber = parseInt(m[2], 10);

  var prevLink = document.getElementById('prevLink');
  var nextLink = document.getElementById('nextLink');
  var progressEl = document.getElementById('chapterProgress');

  // 记录阅读进度到 localStorage
  var progressKey = 'webnovels_reading_progress';
  try {
    var progress = JSON.parse(localStorage.getItem(progressKey) || '{}');
    var existing = progress[novelId] || {};
    // 只在新章节号更大时更新（避免回退覆盖）
    if (!existing.chapter || chapterNumber >= existing.chapter) {
      progress[novelId] = {
        chapter: chapterNumber,
        url: path,
        updated: Date.now()
      };
      localStorage.setItem(progressKey, JSON.stringify(progress));
    }
  } catch (e) {}

  if (!window.NovelDB) return;

  // 从 Supabase 获取上一章/下一章
  NovelDB.ready.then(function () {
    return NovelDB.getAdjacentChapters(novelId, chapterNumber);
  }).then(function (adj) {
    // 更新上一章链接
    if (adj.prev) {
      prevLink.href = '/novels/' + novelId + '/' + adj.prev.chapter_number + '/';
      prevLink.style.visibility = 'visible';
      prevLink.innerHTML = '&laquo; ' + (adj.prev.title || ('Chapter ' + adj.prev.chapter_number));
    } else {
      prevLink.style.visibility = 'hidden';
    }

    // 更新下一章链接
    if (adj.next) {
      nextLink.href = '/novels/' + novelId + '/' + adj.next.chapter_number + '/';
      nextLink.style.visibility = 'visible';
      nextLink.innerHTML = (adj.next.title || ('Chapter ' + adj.next.chapter_number)) + ' &raquo;';
    } else {
      nextLink.style.visibility = 'hidden';
    }
  }).catch(function () {
    // 失败时保留静态导航链接（由 front matter 提供）
  });

  // 显示阅读进度：获取章节总数
  NovelDB.ready.then(function () {
    return NovelDB.chapterList(novelId);
  }).then(function (chapters) {
    if (chapters.length > 0) {
      progressEl.textContent = 'Chapter ' + chapterNumber + ' of ' + chapters.length;
    }
  }).catch(function () {});
})();
</script>
