---
layout: default
---

<article class="novel-chapter">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<h3>{{ page.subtitle }}</h3>{% endif %}
  </header>

  <div class="chapter-content">
    {{ content }}
  </div>

  <div class="chapter-navigation">
    {% if page.previous_chapter %}
      <a href="{{ page.previous_chapter | relative_url }}" class="prev-link">&laquo; Previous</a>
    {% endif %}

    <a href="{{ page.novel_index | relative_url }}" class="index-link">Contents</a>

    {% if page.next_chapter %}
      <a href="{{ page.next_chapter | relative_url }}" class="next-link">Next &raquo;</a>
    {% endif %}
  </div>

  <!-- 加入书架按钮 -->
  <div class="bookmark-bar">
    <button class="bookmark-btn" id="bookmarkBtn" data-novel-url="{{ page.novel_index | default: page.url }}">
      <i class="fa fa-bookmark"></i> <span class="bookmark-text">Add to Bookshelf</span>
    </button>
    <a href="{{ '/bookshelf/' | relative_url }}" class="view-bookshelf-link">
      <i class="fa fa-list"></i> View Bookshelf
    </a>
  </div>
</article>
<div class="sharethis-inline-share-buttons"></div>
<script async="async" data-cfasync="false" src="//pl26635144.profitableratecpm.com/b5f172e1b4dd73e35d84f383d130b32e/invoke.js"></script>
<div id="container-b5f172e1b4dd73e35d84f383d130b32e"></div>
<style>
  .novel-chapter {
    max-width: 800px;
    margin: 0 auto;
    padding: 0px;
    line-height: 1.8;
  }
  
  .chapter-content {
    margin: 0;
    font-size: 1.1em;
  }
  
  .chapter-navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    margin-bottom: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
  
  .chapter-navigation a {
    padding: 8px 16px;
    border: 1px solid #ddd;
    border-radius: 4px;
    text-decoration: none;
  }

  /* 书签栏样式 */
  .bookmark-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    margin-bottom: 30px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
  }
  .bookmark-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.3s, transform 0.2s;
  }
  .bookmark-btn:hover { background: #2980b9; }
  .bookmark-btn:active { transform: scale(0.97); }
  .bookmark-btn.active {
    background: #27ae60;
  }
  .bookmark-btn.active .bookmark-text::before { content: "✓ "; }
  .view-bookshelf-link {
    color: #7f8c8d;
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.3s;
  }
  .view-bookshelf-link:hover { color: #3498db; }
</style>

<script>
// 书架功能 - 基于 localStorage，无需后端
document.addEventListener('DOMContentLoaded', function() {
  var bookmarkBtn = document.getElementById('bookmarkBtn');
  if (!bookmarkBtn) return;

  var novelUrl = bookmarkBtn.getAttribute('data-novel-url');
  var bookshelfKey = 'webnovels_bookshelf';
  var bookshelf = JSON.parse(localStorage.getItem(bookshelfKey) || '[]');

  // 初始化按钮状态
  if (bookshelf.indexOf(novelUrl) !== -1) {
    bookmarkBtn.classList.add('active');
    var textEl = bookmarkBtn.querySelector('.bookmark-text');
    if (textEl) textEl.textContent = 'In Your Bookshelf';
  }

  bookmarkBtn.addEventListener('click', function() {
    var shelf = JSON.parse(localStorage.getItem(bookshelfKey) || '[]');
    var idx = shelf.indexOf(novelUrl);
    if (idx !== -1) {
      shelf.splice(idx, 1);
      bookmarkBtn.classList.remove('active');
      var textEl = bookmarkBtn.querySelector('.bookmark-text');
      if (textEl) textEl.textContent = 'Add to Bookshelf';
    } else {
      shelf.push(novelUrl);
      bookmarkBtn.classList.add('active');
      var textEl2 = bookmarkBtn.querySelector('.bookmark-text');
      if (textEl2) textEl2.textContent = 'In Your Bookshelf';
    }
    localStorage.setItem(bookshelfKey, JSON.stringify(shelf));
  });
});
</script>
